[package]
name = "binarycoder"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
image = "0.25.10"
itertools = "0.15.0"
lazy_static = "1.5.1"
qrcode = "0.14.1"
qrism = "0.1.0"
z85 = "3.0.7"
tar = "0.4"
flate2 = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.5", features = ["cors"] }
base91 = "0.1"